<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>ユーザー編集</title>
</head>

<body>

    {% include "admin/_nav.html" %}

    <p>
        <a href="/admin/users">
            ← ユーザー一覧へ戻る
        </a>
    </p>

    <h1>ユーザー編集</h1>

    {% if error %}
        <p style="color: red;">
            {{ error }}
        </p>
    {% endif %}

    <form
        method="post"
        action="/admin/users/{{ user.id }}/edit"
    >

        <p>
            <label>
                ユーザー名
            </label>
            <br>

            <input
                type="text"
                name="username"
                value="{{ user.username }}"
                required
            >
        </p>

        <p>
            <label>
                Email
            </label>
            <br>

            <input
                type="email"
                name="email"
                value="{{ user.email }}"
                required
            >
        </p>

        <p>
            <label>
                Role
            </label>
            <br>

            <select name="role">

                <option
                    value="editor"
                    {% if user.role == "editor" %}
                    selected
                    {% endif %}
                >
                    editor
                </option>

                <option
                    value="admin"
                    {% if user.role == "admin" %}
                    selected
                    {% endif %}
                >
                    admin
                </option>

            </select>
        </p>

        <p>
            <label>
                <input
                    type="checkbox"
                    name="is_active"
                    {% if user.is_active %}
                    checked
                    {% endif %}
                >
                有効にする
            </label>
        </p>

        <button type="submit">
            保存
        </button>

    </form>

</body>
</html>
