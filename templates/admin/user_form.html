<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>新規ユーザー作成</title>

    <style>
        body {
            font-family: sans-serif;
            max-width: 800px;
            margin: 40px auto;
            padding: 0 20px;
        }

        .field {
            margin-bottom: 20px;
        }

        label {
            display: block;
            font-weight: bold;
            margin-bottom: 6px;
        }

        input,
        select {
            width: 100%;
            box-sizing: border-box;
            padding: 10px;
        }

        .checkbox-label {
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }

        .checkbox-label input {
            width: auto;
        }

        button {
            padding: 10px 20px;
            cursor: pointer;
        }

        .error {
            margin: 20px 0;
            padding: 12px;
            background: #ffe8e8;
            border: 1px solid #d99;
        }
    </style>
</head>

<body>

{% include "admin/_nav.html" %}

<a href="/admin/users">
    ← ユーザー一覧へ戻る
</a>

<h1>新規ユーザー作成</h1>

{% if error %}
<div class="error">
    {{ error }}
</div>
{% endif %}

<form
    method="post"
    action="/admin/users/new"
>

    <div class="field">

        <label for="username">
            ユーザー名
        </label>

        <input
            id="username"
            name="username"
            type="text"
            maxlength="100"
            autocomplete="username"
            required
        >

    </div>


    <div class="field">

        <label for="email">
            Email
        </label>

        <input
            id="email"
            name="email"
            type="email"
            maxlength="255"
            autocomplete="email"
            required
        >

    </div>


    <div class="field">

        <label for="password">
            パスワード
        </label>

        <input
            id="password"
            name="password"
            type="password"
            minlength="12"
            autocomplete="new-password"
            required
        >

        <p>
            12文字以上
        </p>

    </div>


    <div class="field">

        <label for="password_confirm">
            パスワード確認
        </label>

        <input
            id="password_confirm"
            name="password_confirm"
            type="password"
            minlength="12"
            autocomplete="new-password"
            required
        >

    </div>


    <div class="field">

        <label for="role">
            Role
        </label>

        <select
            id="role"
            name="role"
            required
        >
            <option value="editor">
                editor
            </option>

            <option value="admin">
                admin
            </option>
        </select>

    </div>


    <div class="field">

        <label class="checkbox-label">

            <input
                name="is_active"
                type="checkbox"
                value="true"
                checked
            >

            有効にする

        </label>

    </div>


    <button type="submit">
        作成
    </button>

</form>

</body>
</html>
