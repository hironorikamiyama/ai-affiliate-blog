<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>サイト設定</title>

    <style>
        body {
            font-family: sans-serif;
            margin: 0;
            background: #f5f5f5;
            color: #222;
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
            padding: 40px 24px;
            background: #fff;
            min-height: 100vh;
            box-sizing: border-box;
        }

        .admin-nav {
            margin-bottom: 32px;
        }

        .admin-nav a,
        .admin-nav form {
            margin-right: 12px;
        }

        .form-group {
            margin-bottom: 24px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-weight: bold;
        }

        input,
        textarea {
            width: 100%;
            padding: 10px;
            box-sizing: border-box;
            font: inherit;
        }

        textarea {
            min-height: 120px;
            resize: vertical;
        }

        .help {
            margin-top: 6px;
            color: #666;
            font-size: 0.9rem;
        }

        .error {
            margin-bottom: 24px;
            padding: 12px;
            background: #ffecec;
        }

        .success {
            margin-bottom: 24px;
            padding: 12px;
            background: #eef9ee;
        }

        button {
            padding: 10px 20px;
            cursor: pointer;
        }
    </style>
</head>

<body>

<div class="container">

    {% include "admin/_nav.html" %}

    <h1>サイト設定</h1>

    {% if saved %}
    <div class="success">
        サイト設定を保存しました。
    </div>
    {% endif %}

    {% if error %}
    <div class="error">
        {{ error }}
    </div>
    {% endif %}

    <form
        method="post"
        action="/admin/site-settings"
    >

        <div class="form-group">

            <label for="site_name">
                サイト名
            </label>

            <input
                id="site_name"
                name="site_name"
                type="text"
                maxlength="200"
                required
                value="{{
                    site_setting.site_name
                    if site_setting
                    else ''
                }}"
            >

        </div>

        <div class="form-group">

            <label for="site_description">
                サイト説明
            </label>

            <textarea
                id="site_description"
                name="site_description"
            >{{ site_setting.site_description if site_setting and site_setting.site_description else '' }}</textarea>

            <div class="help">
                検索結果やSNS共有などで使用する
                サイト全体の説明です。
            </div>

        </div>

        <div class="form-group">

            <label for="site_url">
                サイトURL
            </label>

            <input
                id="site_url"
                name="site_url"
                type="url"
                maxlength="500"
                placeholder="https://example.com"
                value="{{
                    site_setting.site_url
                    if site_setting and site_setting.site_url
                    else ''
                }}"
            >

            <div class="help">
                本番公開後のサイトURLを設定します。
            </div>

        </div>

        <div class="form-group">

            <label for="default_og_image">
                デフォルトOGP画像URL
            </label>

            <input
                id="default_og_image"
                name="default_og_image"
                type="text"
                maxlength="500"
                value="{{
                    site_setting.default_og_image
                    if site_setting
                    and site_setting.default_og_image
                    else ''
                }}"
            >

            <div class="help">
                記事にアイキャッチ画像がない場合などに
                使用する画像です。
            </div>

        </div>

        <button type="submit">
            保存
        </button>

    </form>

</div>

</body>
</html>
