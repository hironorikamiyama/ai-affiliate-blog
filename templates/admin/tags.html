<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>タグ管理</title>

    <style>
        body {
            font-family: sans-serif;
            max-width: 1000px;
            margin: 40px auto;
            padding: 0 20px;
        }

        .back {
            display: inline-block;
            margin-bottom: 20px;
        }

        .actions {
            margin: 24px 0;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th,
        td {
            padding: 10px;
            border: 1px solid #ccc;
            text-align: left;
        }

        th {
            background: #f3f3f3;
        }

        .inline-form {
            display: inline;
        }

        button,
        .button-link {
            display: inline-block;
            padding: 8px 14px;
            cursor: pointer;
        }
    </style>
</head>

<body>
{% include "admin/_nav.html" %}
<a
    class="back"
    href="/admin/articles"
>
    ← 記事一覧へ戻る
</a>

<h1>タグ管理</h1>

<div class="actions">

    <a
        class="button-link"
        href="/admin/tags/new"
    >
        新規タグ作成
    </a>

</div>


{% if tags %}

<table>

    <thead>

        <tr>
            <th>ID</th>
            <th>名前</th>
            <th>Slug</th>
            <th>操作</th>
        </tr>

    </thead>

    <tbody>

        {% for tag in tags %}

        <tr>

            <td>
                {{ tag.id }}
            </td>

            <td>
                {{ tag.name }}
            </td>

            <td>
                {{ tag.slug }}
            </td>

            <td>

                <a
                    href="/admin/tags/{{ tag.id }}/edit"
                >
                    編集
                </a>

                <form
                    class="inline-form"
                    method="post"
                    action="/admin/tags/{{ tag.id }}/delete"
                    onsubmit="return confirm('このタグを削除しますか？');"
                >
                    <button type="submit">
                        削除
                    </button>
                </form>

            </td>

        </tr>

        {% endfor %}

    </tbody>

</table>

{% else %}

<p>
    登録されているタグはありません。
</p>

{% endif %}

</body>
</html>
