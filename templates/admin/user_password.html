<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>パスワード変更</title>
</head>

<body>

{% include "admin/_nav.html" %}

<p>
    <a href="/admin/users">
        ← ユーザー一覧へ戻る
    </a>
</p>

<h1>パスワード変更</h1>

<p>
    対象ユーザー:
    <strong>{{ user.username }}</strong>
</p>

{% if error %}
<p style="color: red;">
    {{ error }}
</p>
{% endif %}

{% if success %}
<p style="color: green;">
    {{ success }}
</p>
{% endif %}

<form
    method="post"
    action="/admin/users/{{ user.id }}/password"
>

    <p>
        <label for="password">
            新しいパスワード
        </label>
        <br>

        <input
            id="password"
            name="password"
            type="password"
            minlength="12"
            autocomplete="new-password"
            required
        >
    </p>

    <p>
        <label for="password_confirm">
            パスワード確認
        </label>
        <br>

        <input
            id="password_confirm"
            name="password_confirm"
            type="password"
            minlength="12"
            autocomplete="new-password"
            required
        >
    </p>

    <p>
        12文字以上で設定してください。
    </p>

    <button type="submit">
        パスワード変更
    </button>

</form>

</body>
</html>
