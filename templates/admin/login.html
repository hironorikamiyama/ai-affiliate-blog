<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>管理画面ログイン</title>

    <style>
        body {
            font-family: sans-serif;
            background: #f5f5f5;
            margin: 0;
        }

        .login-container {
            max-width: 420px;
            margin: 100px auto;
            padding: 32px;
            background: #fff;
            border: 1px solid #ddd;
            border-radius: 8px;
        }

        h1 {
            margin-top: 0;
        }

        .field {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 6px;
            font-weight: bold;
        }

        input {
            width: 100%;
            box-sizing: border-box;
            padding: 10px;
        }

        button {
            width: 100%;
            padding: 12px;
            cursor: pointer;
        }

        .error {
            margin-bottom: 20px;
            padding: 12px;
            background: #ffe8e8;
            border: 1px solid #d99;
        }
    </style>
</head>

<body>

<div class="login-container">

    <h1>管理画面ログイン</h1>

    {% if error %}
    <div class="error">
        {{ error }}
    </div>
    {% endif %}

    <form
        method="post"
        action="/admin/login"
    >

        <div class="field">

            <label for="username">
                ユーザー名
            </label>

            <input
                id="username"
                name="username"
                type="text"
                autocomplete="username"
                required
                autofocus
            >

        </div>

        <div class="field">

            <label for="password">
                パスワード
            </label>

            <input
                id="password"
                name="password"
                type="password"
                autocomplete="current-password"
                required
            >

        </div>

        <button type="submit">
            ログイン
        </button>

    </form>

</div>

</body>
</html>
