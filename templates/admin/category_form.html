<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        {% if category %}
            カテゴリ編集
        {% else %}
            カテゴリ作成
        {% endif %}
    </title>

    <style>
        body {
            font-family: sans-serif;
            max-width: 800px;
            margin: 40px auto;
            padding: 0 20px;
        }

        .field {
            margin-bottom: 20px;
        }

        label {
            display: block;
            font-weight: bold;
            margin-bottom: 6px;
        }

        input,
        textarea {
            width: 100%;
            box-sizing: border-box;
            padding: 10px;
        }

        textarea {
            min-height: 140px;
        }

        button {
            padding: 10px 20px;
            cursor: pointer;
        }
    </style>
</head>

<body>

{% include "admin/_nav.html" %}

<a href="/admin/categories">
    ← カテゴリ一覧へ戻る
</a>


{% if category %}

<h1>カテゴリ編集</h1>

<form
    method="post"
    action="/admin/categories/{{ category.id }}/edit"
>

{% else %}

<h1>カテゴリ作成</h1>

<form
    method="post"
    action="/admin/categories/new"
>

{% endif %}


    <div class="field">

        <label for="name">
            名前
        </label>

        <input
            id="name"
            name="name"
            type="text"
            value="{{ category.name if category else '' }}"
            maxlength="100"
            required
        >

    </div>


    <div class="field">

        <label for="slug">
            Slug
        </label>

        <input
            id="slug"
            name="slug"
            type="text"
            value="{{ category.slug if category else '' }}"
            maxlength="100"
            required
        >

    </div>


    <div class="field">

        <label for="description">
            説明
        </label>

        <textarea
            id="description"
            name="description"
        >{{ category.description if category and category.description else '' }}</textarea>

    </div>


    <button type="submit">

        {% if category %}
            更新
        {% else %}
            作成
        {% endif %}

    </button>

</form>

</body>
</html>
