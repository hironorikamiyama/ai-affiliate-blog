<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>ページが見つかりません</title>

    <meta
        name="robots"
        content="noindex, follow"
    >

    <style>
        body {
            font-family: sans-serif;
            line-height: 1.8;
            margin: 0;
            background: #f7f7f7;
            color: #222;
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
            padding: 60px 24px;
            background: #fff;
            min-height: 100vh;
            box-sizing: border-box;
        }

        h1 {
            font-size: 2rem;
            margin-bottom: 24px;
        }

        .message {
            margin-bottom: 32px;
        }

        .back {
            display: inline-block;
        }
    </style>
</head>

<body>

<div class="container">

    <h1>
        ページが見つかりません
    </h1>

    <p class="message">
        お探しのページは削除されたか、
        URLが変更された可能性があります。
    </p>

    <a
        class="back"
        href="/blog"
    >
        ← 記事一覧へ戻る
    </a>

</div>

</body>
</html>
